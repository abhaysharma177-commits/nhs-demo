<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator tests</title>
<style>
  :root { --paper:#F7F8F6; --ink:#14201B; --slate:#4F5D57; --rule:#CDD4D0; --spruce:#0B6B5D; --fail:#9B2C2C; }
  body { margin:0; padding:40px; background:var(--paper); color:var(--ink);
         font:18px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  h1 { font-size:1.6rem; margin:0 0 .25rem; font-weight:600; }
  p { margin:0 0 1.5rem; color:var(--slate); }
  .summary { font-size:1.25rem; font-weight:600; padding:.75rem 1rem; border:1px solid var(--rule); border-left:6px solid var(--spruce); margin-bottom:1.5rem; background:#fff; }
  .summary.bad { border-left-color:var(--fail); }
  ol { list-style:none; padding:0; margin:0; border-top:1px solid var(--rule); }
  li { display:grid; grid-template-columns:4.5rem 1fr; gap:1rem; padding:.4rem 0; border-bottom:1px solid var(--rule); }
  .tag { font:600 .85rem/1.9 "Cascadia Mono", Consolas, monospace; }
  .pass .tag { color:var(--spruce); }
  .fail .tag { color:var(--fail); }
  .detail { display:block; color:var(--fail); font:.85rem "Cascadia Mono", Consolas, monospace; margin-top:.2rem; }
  a { color:var(--spruce); }
</style>
</head>
<body>
<h1>Simulator tests</h1>
<p>Checks the four preset queries and the chunking toggle against the real engine. Same checks as <code>node tests.js</code>. <a href="index.html">Back to the demo</a></p>
<div id="summary" class="summary">Running…</div>
<ol id="list"></ol>
<script src="config.js"></script>
<script src="corpus.js"></script>
<script src="engine.js"></script>
<script src="tests.js"></script>
<script>
  (function () {
    var results = runTests(Engine, CORPUS, CONFIG);
    var failed = results.filter(function (r) { return !r.pass; });
    var list = document.getElementById("list");
    results.forEach(function (r) {
      var li = document.createElement("li");
      li.className = r.pass ? "pass" : "fail";
      var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = r.pass ? "PASS" : "FAIL";
      var name = document.createElement("span"); name.textContent = r.name;
      if (!r.pass) { var d = document.createElement("span"); d.className = "detail"; d.textContent = r.detail; name.appendChild(d); }
      li.appendChild(tag); li.appendChild(name); list.appendChild(li);
    });
    var s = document.getElementById("summary");
    s.textContent = (results.length - failed.length) + " of " + results.length + " checks passed";
    if (failed.length) s.classList.add("bad");
    console.log("[tests] " + s.textContent);
  })();
</script>
</body>
</html>
